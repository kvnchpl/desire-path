<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A cartography of encounters connected through different kinds of nearness.">
    <title>DESIRE PATH</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
    <link rel="stylesheet" href="css/main.css">
  </head>
  <body>
    <a class="skip-link" href="#encounter">Skip to encounter</a>

    <main class="landscape">
      <section class="map-region" aria-label="Encounter map">
        <div id="map" class="map" role="application" aria-label="Paths near the current encounter">
          <p class="map-fallback">The landscape is waiting.</p>
        </div>
      </section>

      <aside class="interface" aria-label="Explore desire path">
        <header class="site-header">
          <h1>DESIRE PATH</h1>
        </header>

        <form class="explore" id="explore-form">
          <fieldset>
            <legend>Explore</legend>
            <label><input type="checkbox" name="dimension" value="place"> <span>Place</span></label>
            <label><input type="checkbox" name="dimension" value="time" checked> <span>Time</span></label>
            <label><input type="checkbox" name="dimension" value="feeling" checked> <span>Feeling</span></label>
            <label><input type="checkbox" name="dimension" value="knowing" checked> <span>Knowing</span></label>
          </fieldset>
        </form>

        <details class="debug">
          <summary>debug</summary>
          <label><input type="checkbox" id="debug-show-all"> <span>show all nodes</span></label>
          <label><input type="checkbox" id="debug-show-ids"> <span>show node ids</span></label>
        </details>

        <article class="encounter" id="encounter" tabindex="-1" aria-live="polite">
          <h2 id="encounter-title">Arriving</h2>
          <div id="encounter-media" class="encounter-media">
            <p>The first encounter will appear here.</p>
          </div>
        </article>

        <button class="retrace" id="retrace" type="button" disabled>Retrace</button>
        <p class="status" id="status" role="status">Preparing the landscape.</p>
      </aside>
    </main>

    <noscript>
      <p class="noscript">This landscape needs JavaScript to reveal its paths.</p>
    </noscript>
    <script src="vendor/leaflet/leaflet.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
